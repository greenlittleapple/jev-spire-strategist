name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The project is built and tested on Windows; the tests need no API key or game.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - run: npm test
      - run: npm run sts2:test
