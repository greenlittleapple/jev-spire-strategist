<text x="24" y="816" font-size="12.5" font-weight="400" fill="#898781" text-anchor="start">Beating the final boss on floor 48 wins the run. Strategist runs use fixed seeds (JEV1 to JEV5) so versions can be compared on the same maps; v3.1</text>
<text x="24" y="834" font-size="12.5" font-weight="400" fill="#898781" text-anchor="start">to v3.3 replayed v3's non-combat choices on JEV1, so only their combat play differed.</text>
<text x="24" y="852" font-size="12.5" font-weight="400" fill="#898781" text-anchor="start">The imported Jev the Spire policy reached the Act 3 boss once, in a Hextech Mayhem run. That modifier changes the game, so the run is not plotted.</text>
<text x="24" y="870" font-size="12.5" font-weight="400" fill="#898781" text-anchor="start">Runs still in progress are not plotted.</text>
